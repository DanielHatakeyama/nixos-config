name: check

on:
  # branches-only: every switch now tags gen/<N> (modules/hm-auto-commit.nix),
  # and an unscoped `push:` triggers a second, redundant run per tag push.
  push:
    branches:
      - main
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check --print-build-logs
